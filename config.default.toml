# Path to a toml file specifying a theme.
#
# Relative paths are resolved relative to the directory containing this config
# file, e.g. ~/.config/dumb/.
#
# See `theme.default.toml` for available theming options.
#theme = "theme.default.toml"

# The layout for the header line. Can be either "single_line" or "multi_line".
default_header_layout = "single_line"

# Can be one of `name`, `size`, or `mod_time`.
default_sort_mode = "size"

# The size metric used to display and sort entries:
# - "freed" displays the size that would be freed if the entry would be
#   deleted. This accounts for hardlinks, i.e. files that have hardlinks
#   outside the directory are not counted, and files that have hardlinks
#   only inside the directory are deduplicated.
# - "naive" displays the size obtained from naively summing up the sizes of all
#   contained paths.
# Sizes are disk usage (allocated blocks), not apparent file sizes.
# Can be toggled at runtime by pressing `m`.
default_size_metric = "freed"

# Whether to show the `Size Cur` column (the size relative to the current
# directory) by default. The column is only relevant in subdirectories.
# Can be toggled at runtime by pressing `c`.
default_show_size_cur_column = true

# Initial width of the Name column in the file tree.
# 0 means that the column automatically takes the leftover terminal width
# after all other columns. Can be changed at runtime with `+` and `-`, which
# also switch between auto width and a fixed width.
default_name_column_width = 0

# Whether the header should replace `$HOME` with `~` in the directory prefix.
display_home_as_tilde = true

# Maximum width chosen by the auto Name column width (i.e. if
# default_name_column_width is 0). 0 means no maximum. The user can still
# increase the column beyond this maximum with `+`.
max_name_column_width = 0

# Enable the delete keybinding, which allows removing the selected directory
# entry recursively when pressing `d`.
enable_delete_binding = true

# Pressing the delete keybinding shows a confirmation dialog, which requires
# pressing `y` to delete.
require_delete_confirmation = true
