name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Each build variant runs on a pinned runner of its own architecture,
    # so every target compiles natively and no cross toolchain is needed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Verify musl binaries are static, linked against musl, and runnable
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/dumb"
          file "$BIN"
          file "$BIN" | grep -qE "statically linked|static-pie linked"
          ! strings "$BIN" | grep -q "ld-linux-"
          "$BIN" --help > /dev/null

      - name: Package
        run: |
          tar czf "dumb-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" dumb

      - uses: actions/upload-artifact@v4
        with:
          name: dumb-${{ matrix.target }}
          path: dumb-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The top version section of the changelog becomes the release notes.
          if [ -s CHANGELOG.md ]; then
            awk '/^## /{c++; next} c==1' CHANGELOG.md > notes.md
            NOTES=(--notes-file notes.md)
          else
            NOTES=(--notes "See the repository for details.")
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Release already exists (e.g. tag was force-pushed): refresh it.
            gh release upload --clobber "${GITHUB_REF_NAME}" artifacts/*.tar.gz
            gh release edit "${GITHUB_REF_NAME}" "${NOTES[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              "${NOTES[@]}" \
              artifacts/*.tar.gz
          fi
