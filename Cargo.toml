[package]
name = "dumb"
version = "0.1.1"
edition = "2024"
description = "An interactive TUI version of the standard unix du program."
license = "MIT"
repository = "https://github.com/m0rphism/dumb"
readme = "README.md"
keywords = ["cli", "tui", "du", "disk-usage", "disk"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_default_utils = { version = "0.3.2", features = ["inline"] }
toml = "1.1.8"
